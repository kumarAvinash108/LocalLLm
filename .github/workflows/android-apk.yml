# Builds the Android app on EAS and publishes it to a GitHub Release.
#
# Triggers:
#   - every push to main (including merged PRs) → always builds the
#     `preview` profile (installable APK, rolling `latest` release)
#   - manually via "Run workflow" in the Actions tab → you pick the
#     profile: `preview` (APK) or `production` (AAB for Play Store).
#     The `production` build ONLY runs when triggered manually here —
#     pushes to main never build it.
#
# One-time setup ( Maintainer only ):
#   1. Create an Expo account, then run once locally and follow the prompts
#      (links the EAS projectId + creates the Android keystore):
#        npx eas-cli build --platform android --profile preview
#      Commit the resulting app.json / eas.json changes.
#   2. Create an access token at https://expo.dev/settings/access-tokens
#      and add it as a repo secret named EXPO_TOKEN
#      (Repo → Settings → Secrets and variables → Actions).

name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build Android app and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Manual runs use the chosen profile; pushes always use preview.
      PROFILE: ${{ github.event.inputs.profile || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS
        run: eas build --platform android --profile "$PROFILE" --non-interactive --wait --json > build.json

      - name: Download build artifact
        id: artifact
        run: |
          echo "=== profile: $PROFILE ==="
          echo "=== build.json preview ==="
          head -c 5000 build.json; echo
          URL=$(jq -r 'if type == "array" then .[0] else . end | .artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' build.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Failed to extract artifact URL from build.json"
            jq . build.json
            exit 1
          fi
          if [ "$PROFILE" = "production" ]; then
            FILE=LocalLLM.aab
          else
            FILE=LocalLLM.apk
          fi
          echo "Artifact URL: $URL"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          curl -L --fail -o "$FILE" "$URL"
          ls -lh "$FILE"

      - name: Publish rolling 'latest' release (preview APK)
        if: env.PROFILE == 'preview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest LocalLLM.apk \
            --title "Latest Android APK" \
            --notes "Auto-built (preview profile) from ${{ github.sha }} on $(date -u +%Y-%m-%d). Install on a physical Android device — Expo Go is not supported."

      - name: Publish rolling 'production' release (production AAB)
        if: env.PROFILE == 'production'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete production --cleanup-tag --yes || true
          gh release create production LocalLLM.aab \
            --title "Production Android AAB" \
            --notes "Manually triggered production build from ${{ github.sha }} on $(date -u +%Y-%m-%d). Upload this AAB to the Play Console."

      - name: Upload build as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: LocalLLM-${{ env.PROFILE }}
          path: ${{ steps.artifact.outputs.file }}
